server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client-side SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Uploads reverse proxy to Spring Boot backend
    location /uploads/ {
        proxy_pass http://backend:8080/api/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    # Files reverse proxy to Spring Boot backend
    location /files/ {
        proxy_pass http://backend:8080/api/files/;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }
}
