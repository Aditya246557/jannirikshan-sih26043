# ============================================================
# SIH26043 - APPLICATION CONFIGURATION
# ============================================================

spring.application.name=JanNirikshan


# ============================================================
# SERVER
# ============================================================

server.port=8080

server.servlet.context-path=/api


# ============================================================
# POSTGRESQL DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sih26043}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:Ishant@09ph}

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true

spring.jackson.serialization.fail-on-empty-beans=false


# ============================================================
# DATABASE INITIALIZATION
# ============================================================

spring.sql.init.mode=never


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=100MB


# ============================================================
# APPLICATION FILE STORAGE
# ============================================================

app.file.upload-dir=${UPLOAD_DIR:uploads/complaints}

app.file.max-size=20971520

app.file.allowed-types=image/jpeg,image/png,image/webp,application/pdf


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_FOR_SIH26043}

app.jwt.expiration=86400000


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

app.cors.allowed-headers=*

app.cors.allow-credentials=true


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO

logging.level.com.jannirikshan=INFO

logging.level.org.springframework.security=INFO


# ============================================================
# ERROR HANDLING
# ============================================================

server.error.include-message=always

server.error.include-binding-errors=always

server.error.include-stacktrace=never

# ============================================================
# FASTAPI AI SERVICE (REAL TRAINED YOLO MODEL)
# ============================================================
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.connect-timeout=5s
ai.service.read-timeout=30s
ai.service.enabled=true